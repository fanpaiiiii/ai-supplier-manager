<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2D8B4E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="供应商管理">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">
  <title>AI 供应商管理器</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // Unregister any existing service workers from parent scope (trade tool)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => {
          if (reg.scope !== location.origin + '/supplier/') {
            reg.unregister()
          }
        })
      })
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
